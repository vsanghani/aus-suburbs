name: DB migrate (dev)

# Applies Alembic migrations to the Neon `dev` branch when `development` changes.

on:
  push:
    branches: [development]
    paths:
      - "backend/alembic/**"
      - "backend/alembic.ini"
      - "backend/app/**"
      - "backend/pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two migrations against the same database at once, and never cancel one mid-flight.
concurrency:
  group: db-migrate-dev
  cancel-in-progress: false

jobs:
  migrate-dev:
    name: migrate-dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/development'
    env:
      NEON_DB_URL: ${{ secrets.DATABASE_URL_DEV }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check required secrets are configured
        run: |
          if [ -z "${NEON_DB_URL}" ]; then
            echo "::error::Repository secret DATABASE_URL_DEV is not set. See docs/ci-database.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: pip install -e .

      - name: alembic upgrade head (dev)
        run: |
          # Accept either postgresql:// or postgresql+psycopg:// in the secret.
          DATABASE_URL="postgresql+psycopg://${NEON_DB_URL#*://}"
          export DATABASE_URL
          alembic upgrade head
          alembic current
