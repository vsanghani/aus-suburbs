<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--seo-start-->
    <title>Australian suburbs</title>
    <meta
      name="description"
      content="A public record of Australian suburbs for housing, property, schools, transport, safety, and hazards, read from government datasets."
    />
    <!--seo-end-->
    <link
      rel="preload"
      href="/fonts/inter-latin-opsz-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-tight-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.dataset.theme = "dark";
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (error) {
          /* Storage can be blocked. The page still renders in the light theme. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="application/json" id="route-data">
      null
    </script>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
